function buildAnswer(msg,variant=0){const alternatives={interaction:['建议采用“先批注、再朗读、后说明”的小组任务：每人选择一句标注重音与停连，再由小组推荐一人展示。','可以改成“替换字辩论”：一组主张保留“舞、驰”，另一组尝试替换，双方用画面和情感证据回应。'],cold:['如果学生说不出“惜”的复杂态度，先让他们分别列出帝王的功绩和局限，再选择“肯定、批评、惋惜”中的两个词。','可以先给出“略输、稍逊、只识”三个程度词，让学生比较语气轻重，从词语本身发现评价态度。'],time:['建议第一课时完成字词、上阕朗读和意象赏析；第二课时集中处理评史、主旨与古今思辨。','可以将背景介绍压缩为一张时间轴，把更多时间留给两次朗读展示和“惜”字讨论。'],easy:['建议为朗读设计提供“重音、停连、语调”三项选择表，基础学生先完成一项再解释。','可以把开放赏析拆成“写了什么—怎么写—表达什么”三步支架，降低完整表达难度。'],general:['建议将这一模块改成“文本证据—学生判断—朗读验证—教师追问”的结构，让赏析落到具体词句。','可以减少背景讲解，增加一次可操作的朗读或替换比较，并补充学生可能出现的两种回答。']};let key=msg.includes('互动')?'interaction':msg.includes('冷场')?'cold':msg.includes('课时')?'time':msg.includes('难度')?'easy':'general';return alternatives[key][variant%alternatives[key].length]}

function adoptedPayload(type,index){if(type==='resources'){const x=resourceItems[index];return {sectionId:index<2?'intro':index<4?'history':'thinking',line:`采用资料：${x[0]}。${x[1]}`,slide:[`采用资料：${x[0]}`,x[1]]}}if(type==='interaction'){const x=interactionItems[index];return {sectionId:index<2?'scene':index<4?'history':'thinking',line:`课堂互动：${x[0]}。学生预设：${x[1]} 教师应对：${x[2]}`,slide:[`互动：${x[0]}`,`预设：${x[1]}｜应对：${x[2]}`]}}if(type==='exercise'){const x=exerciseItems[index];return {sectionId:index<2?'preview':index<4?'scene':'thinking',line:`课堂练习：${x[0]}——${x[1]}`,slide:[`课堂练习：${x[0]}`,x[1]]}}const x=homeworkItems[index];return {sectionId:'homework',line:`${x[0]}：${x[1]}`,slide:[`分层作业：${x[0]}`,x[1]]}}
function syncAdopted(){const pending=[...state.adopted].filter(key=>!state.synced.has(key));pending.forEach(key=>{const [type,indexText]=key.split(':'),payload=adoptedPayload(type,+indexText),sec=state.sections.find(x=>x.id===payload.sectionId);if(sec&&!sec.lines.includes(payload.line))sec.lines.push(payload.line);if(!state.syncedSlides.some(x=>x[0]===payload.slide[0]))state.syncedSlides.push(payload.slide);state.synced.add(key)});state.adopted.clear();state.needsSync=false;return pending.length}
function syncMaterials(){const pendingCount=[...state.adopted].filter(key=>!state.synced.has(key)).length;if(!pendingCount&&!state.needsSync){toast('没有待同步的内容');return}modal('同步材料',`<p style="margin-top:0">将 ${pendingCount} 项已采纳内容写入教案和 PPT。</p>${state.dirty.size?`<div class="audit-item warn">${icon('risk')}<div><b>${state.dirty.size} 处人工编辑将保留</b><p>同步内容会追加到相关模块，不会覆盖老师修改。</p></div></div>`:''}`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="confirmSync">确认同步</button>`);$('confirmSync').onclick=()=>{const count=syncAdopted();closeModal();renderWorkspace();toast(`已将 ${count} 项内容同步到教案和 PPT`)}}
function showAudit(){modal('导出前检查',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>导入视频需控制时长</b><p>两段雪景视频建议合计不超过3分钟。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源已识别</b><p>参考资料、真实教案和原课件均已用于本次备课。</p></div></div></div>`,`<button class="btn btn-secondary" data-close>继续修改</button><button class="btn btn-primary" id="auditExport">继续导出</button>`);$('auditExport').onclick=()=>{closeModal();showExport()}}
function showExport(){modal('导出备课材料',`<p style="margin-top:0;color:var(--ink-2)">选择本次要下载的文件。Demo 当前可实际导出 Word，其余格式展示完整流程。</p>${outputs.filter(o=>state.selectedOutputs.has(o.id)).map((o,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--line)"><input type="checkbox" ${i===0?'checked':''} ${o.id==='lesson'?'':'disabled'}><span>${icon(o.icon)} <b>${o.name}</b></span><span style="margin-left:auto;color:var(--ink-3);font-size:11px">${o.id==='lesson'?'.doc':'演示版暂不下载'}</span></label>`).join('')}`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="downloadWord">导出 Word</button>`);$('downloadWord').onclick=()=>{exportWord();closeModal();setTimeout(showFeedback,350)}}
function exportWord(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>教案</title></head><body><h1 style="text-align:center">${esc(state.query)}</h1><p>班级基础：${state.inputs.base}　课时：${state.inputs.duration}　风格：${state.inputs.style}</p>${state.sections.map((s,i)=>`<h2>${i+1}. ${esc(s.title)}（${s.time}）</h2>${s.lines.map(l=>`<p>${esc(l)}</p>`).join('')}`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='教案_'+state.query.replace(/[\\/:*?"<>|\s]+/g,'_')+'.doc';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Word 教案已导出')}
function showFeedback(){modal('这节课上完后，欢迎回来告诉我',`<p style="margin-top:0;color:var(--ink-3);font-size:12px">30 秒反馈会沉淀为这个班的备课经验，下次生成更贴合。</p><div class="feedback-options"><button class="feedback-option" data-feedback="好用">👍<br><b>整体好用</b></button><button class="feedback-option" data-feedback="需调整">🛠<br><b>需要调整</b></button></div><textarea class="feedback-note" placeholder="例如：导入有效，但练习偏难（可稍后填写）"></textarea>`,`<button class="btn btn-secondary" data-close>稍后再说</button><button class="btn btn-primary" id="saveFeedback">保存并复制本课</button>`);document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{state.feedback=b.dataset.feedback;document.querySelectorAll('[data-feedback]').forEach(x=>x.classList.toggle('selected',x===b))});$('saveFeedback').onclick=()=>{closeModal();toast('反馈已保存，下次可从本课复制创建')}}
function modal(title,body,foot){const old=$('globalModal');if(old)old.remove();const el=document.createElement('div');el.id='globalModal';el.className='modal';el.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;document.body.appendChild(el);el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const el=$('globalModal');if(el)el.remove()}
render();
</script></body></html>
