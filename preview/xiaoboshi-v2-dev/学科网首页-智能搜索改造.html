<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学科网首页 · 智能搜索改造</title>
<style>
  :root { --font-zh: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font-zh); background: #eef2f8; }
  #root { min-height: 100vh; }
  .zx-pop { animation: zxPop .16s ease both; transform-origin: top; }
  @keyframes zxPop { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: none; } }
  .zx-ai-btn { transition: transform .14s ease, filter .14s ease; }
  .zx-ai-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .zx-exrow { transition: background .14s, border-color .14s; }
  .zx-exrow:hover { background: #eef4ff !important; border-color: #cfe0ff !important; }
  input::placeholder { color: #aab4c4; }
  .scheme-frame { background: #fff; border: 1px solid #e2e8f2; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 44px -28px rgba(30,50,90,.35); }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#2f73e0"/>
    <g transform="translate(50 50)">
      <circle r="20" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M14 14 L26 26" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M-4 -10 L-4 -2 M-9 -6 L1 -6" stroke="#ffd24a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="zxxk-search.jsx"></script>
<script type="text/babel" src="zxxk-chrome.jsx"></script>

<script type="text/babel">
const { useState: mS } = React;

// 学科网首页固定参数（本页为独立成品页，点击任一方案的搜索 → 整页跳转「AI 小博士」index.html，不内嵌）
const T = {
  accent: "linear-gradient(135deg,#2f73e0,#5b8cff 60%,#7a6bff)",
  aiLabel: "智能搜索",
  entryScale: 1.0,
  showExamples: true,
  showBadge: true,
};

const SCHEMES = [
  { id: "A",  name: "方案 A · 统一智能框",      desc: "一个框听得懂需求，主按钮随输入在「搜索 / 智能搜索」间自动切换。", Comp: SearchUnified },
  { id: "A1", name: "方案 A1 · 智能开关",        desc: "同一个框，用开关显式切换「AI 智能搜索 / 传统关键词检索」。",   Comp: SearchUnifiedToggle },
  { id: "B",  name: "方案 B · Tab 切换",          desc: "资源搜索 / AI 智能搜索 双 Tab，各自独立的输入与行为。",       Comp: SearchTab },
  { id: "C",  name: "方案 C · 独立智能按钮",      desc: "保留原搜索，旁边并列一个独立的「AI 智能搜索」入口。",         Comp: SearchSeparate },
];

function SchemeFrame({ s }) {
  const [pop, setPop] = mS(false);
  const Comp = s.Comp;
  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, margin: "0 4px 12px" }}>
        <span style={{ fontSize: 16.5, fontWeight: 800, color: "#1f2c44" }}>{s.name}</span>
        <span style={{ fontSize: 13, color: "#6b7689" }}>{s.desc}</span>
      </div>
      <div className="scheme-frame" style={{ height: 560, position: "relative", zIndex: pop ? 30 : 1 }}>
        <ZxxkChrome popOpen={pop}>
          <Comp t={T} onPop={setPop} />
        </ZxxkChrome>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ maxWidth: 1180, margin: "0 auto", padding: "30px 26px 60px" }}>
      <header style={{ marginBottom: 26 }}>
        <h1 style={{ fontSize: 23, fontWeight: 800, color: "#16233c", margin: "0 0 8px" }}>学科网首页 · 智能搜索改造</h1>
        <p style={{ fontSize: 14, color: "#5a6680", margin: 0, lineHeight: 1.65 }}>四个独立方案的首页样式对比。点击任一方案的搜索框 / 回车 / 推荐问法，都会整页跳转到 <b style={{ color: "#2f73e0" }}>AI 小博士</b> 并带入需求 —— 本页不内嵌小博士。</p>
      </header>
      {SCHEMES.map((s) => <SchemeFrame key={s.id} s={s} />)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
