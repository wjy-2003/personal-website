function buildAnswer(msg,variant=0){const alternatives={interaction:['建议采用“先批注、再朗读、后说明”的小组任务：每人选择一句标注重音与停连，再由小组推荐一人展示。','可以改成“替换字辩论”：一组主张保留“舞、驰”，另一组尝试替换，双方用画面和情感证据回应。'],cold:['如果学生说不出“惜”的复杂态度，先让他们分别列出帝王的功绩和局限，再选择“肯定、批评、惋惜”中的两个词。','可以先给出“略输、稍逊、只识”三个程度词，让学生比较语气轻重，从词语本身发现评价态度。'],time:['建议第一课时完成字词、上阕朗读和意象赏析；第二课时集中处理评史、主旨与古今思辨。','可以将背景介绍压缩为一张时间轴，把更多时间留给两次朗读展示和“惜”字讨论。'],easy:['建议为朗读设计提供“重音、停连、语调”三项选择表，基础学生先完成一项再解释。','可以把开放赏析拆成“写了什么—怎么写—表达什么”三步支架，降低完整表达难度。'],general:['建议将这一模块改成“文本证据—学生判断—朗读验证—教师追问”的结构，让赏析落到具体词句。','可以减少背景讲解，增加一次可操作的朗读或替换比较，并补充学生可能出现的两种回答。']};let key=msg.includes('互动')?'interaction':msg.includes('冷场')?'cold':msg.includes('课时')?'time':msg.includes('难度')?'easy':'general';return alternatives[key][variant%alternatives[key].length]}

function acceptAnswer(index){const answer=state.chat[index];if(!answer||answer.role!=='ai')return;let target=answer.target;if(!target){const fallback=state.sections.find(x=>x.id==='intro')||state.sections[0];target={sectionId:fallback.id,lineIndex:null}}const sec=state.sections.find(x=>x.id===target.sectionId);if(!sec)return;const scrollEl=document.querySelector('.content-scroll');const scrollTop=scrollEl?scrollEl.scrollTop:0;const sectionEl=document.querySelector(`[data-section="${sec.id}"]`);if(!sectionEl)return;const content=sectionEl.querySelector('.section-content');const tools=sectionEl.querySelector('.section-tools');const item=document.createElement('div');item.className='accepted-line';item.contentEditable='true';item.textContent=answer.text;if(content&&tools)content.insertBefore(item,tools);else if(content)content.appendChild(item);if(Number.isInteger(target.lineIndex)){const lines=getSectionBodyLines(sec);lines[target.lineIndex]=answer.text;state.dirty.add(`${sec.id}-${target.lineIndex}`)}else{getSectionBodyLines(sec).push(answer.text);state.dirty.add(`${sec.id}-${getSectionBodyLines(sec).length-1}`)}answer.accepted=true;const btn=sectionEl.querySelector(`[data-accept-answer="${index}"]`);if(btn){btn.disabled=true;btn.textContent='已采纳'}requestAnimationFrame(()=>{const next=document.querySelector('.content-scroll');if(next)next.scrollTop=scrollTop});toast(`已采纳到“${sec.title}”`) }

function updateSimBubble(id){const sec=state.sections.find(x=>x.id===id);const sectionEl=document.querySelector(`[data-section="${id}"]`);if(!sec||!sectionEl)return;const contentEl=sectionEl.querySelector('.section-content');if(!contentEl)return;let bubble=contentEl.querySelector('.sim-bubble');const tools=contentEl.querySelector('.section-tools');if(!state.sim[id]||!state.sim[id].active){if(bubble)bubble.remove();return}const html=renderSimBubble(sec);if(bubble){bubble.outerHTML=html}else if(tools){const wrap=document.createElement('div');wrap.innerHTML=html;tools.parentNode.insertBefore(wrap.firstElementChild,tools)}else{const wrap=document.createElement('div');wrap.innerHTML=html;contentEl.appendChild(wrap.firstElementChild)}bubble=contentEl.querySelector('.sim-bubble');if(bubble){bubble.querySelectorAll('[data-sim-react]').forEach(b=>b.onclick=()=>chooseReaction(b.dataset.simReact,b.dataset.react));bubble.querySelectorAll('[data-sim-end]').forEach(b=>b.onclick=()=>endSimClassroom(b.dataset.simEnd))}}

function showCompare(id,action,j=0){const sec=state.sections.find(x=>x.id===id);if(!sec)return;const lines=getSectionBodyLines(sec);const index=Number.isInteger(j)?j:0;const old=lines[index]||lines[0]||'';const fresh=action==='增加互动'?old+' 学生先独立写下判断，再由小组轮流发言；教师抽取一组不同意见进行追问。':action==='更简洁'?old.replace(/。.*$/,'。'):action==='更具体'?old+' 教师可补充“莽莽”形容白茫茫一片、“妖娆”突出红装素裹的具体画面。':action==='加例子'?old+' 例如：用“略输文采”与“稍逊风骚”比较两个词语气轻重的差异。':action==='降低难度'?old+' 建议提供“重音、停连、语调”三项选择表，基础学生先完成其中一项并解释。':action==='调整时长'?old+' 若课时紧张，可将此处压缩为同桌互读并抽查一组展示。':action==='口语化'?old+' 可以换成更像老师上课会说的话，比如“先看看这句写了什么，再想它为什么这么写”。':old+' 教师根据学生可能出现的两类回答准备追问，并设置可操作的支架。';lines[index]=fresh;state.dirty.add(`${sec.id}-${index}`);const sectionEl=document.querySelector(`[data-section="${id}"]`);if(sectionEl){const lineEl=sectionEl.querySelector(`[data-section-id="${id}"][data-line-index="${index}"]`);if(lineEl)lineEl.innerText=fresh}toast(`已更新“${sec.title}”中的内容`)}

function showExport(){modal('导出教案',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>格式要求文件是否准备好</b><p>当前教案已按格式要求文件的结构校验，可继续导出。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源置信度已达标</b><p>参考资料、格式要求文件和原课件均已用于本次备课。</p></div></div></div><p style="margin:14px 0 0;color:var(--ink-3);font-size:12px">确认无误后直接导出当前方案。</p>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="downloadWord">导出 Word</button>`);$('downloadWord').onclick=()=>{exportWord();closeModal();setTimeout(showFeedback,350)}}
function exportWord(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>教案</title></head><body><h1 style="text-align:center">${esc(state.query)}</h1><p>班级基础：${state.inputs.base}　课时：${state.inputs.duration}　风格：${state.inputs.style}</p>${state.sections.map((s,i)=>`<h2>${i+1}. ${esc(s.title)}（${s.time}）</h2>${getSectionLines(s).map(l=>`<p>${esc(l)}</p>`).join('')}`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='教案_'+state.query.replace(/[\\/:*?"<>|\s]+/g,'_')+'.doc';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Word 教案已导出')}

function showWorkspaceFeedback(){state.wsFeedbackOpen=true;renderWorkspace()}
function showFeedback(){modal('这节课上完后，欢迎回来告诉我',`<p style="margin-top:0;color:var(--ink-3);font-size:12px">您的反馈会为小博士沉淀该班级的备课经验，下次生成更贴合！</p><div class="feedback-options"><button class="feedback-option" data-feedback="好用">👍<br><b>整体好用</b></button><button class="feedback-option" data-feedback="需调整">🛠<br><b>需要调整</b></button></div><textarea class="feedback-note" placeholder="例如：导入有效，但练习偏难（可稍后填写）"></textarea>`,`<button class="btn btn-secondary" data-close>稍后再说</button><button class="btn btn-primary" id="saveFeedback">保存并复制本课</button>`);document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{state.feedback=b.dataset.feedback;document.querySelectorAll('[data-feedback]').forEach(x=>x.classList.toggle('selected',x===b))});$('saveFeedback').onclick=()=>{closeModal();toast('反馈已保存，下次可从本课复制创建')}}
function showSolutionPrompt(){modal('例题思路 · “山舞银蛇，原驰蜡象，欲与天公试比高”',`<div class="solution-step"><b>1</b><div><div class="highlight">抓意象：圈出“山、银蛇、原、蜡象、天公”，明确比喻/拟人对象。</div><div class="why">作用：先建立画面，让学生从具象进入抽象。</div></div></div><div class="solution-step"><b>2</b><div><div class="highlight">品动词：“舞”“驰”化静为动，写出群山高原的勃勃生机。</div><div class="why">作用：引导学生体会以动写静的手法效果。</div></div></div><div class="solution-step"><b>3</b><div><div class="highlight">析情感：“欲与天公试比高”把景物人格化，暗含诗人的豪迈气概。</div><div class="why">作用：从景物赏析自然过渡到下阕评史抒怀。</div></div></div>`,`<button class="btn btn-secondary" data-close>关闭</button>`)}
function modal(title,body,foot){const old=$('globalModal');if(old)old.remove();const el=document.createElement('div');el.id='globalModal';el.className='modal';el.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;document.body.appendChild(el);el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const el=$('globalModal');if(el)el.remove()}
render();
</script></body></html>
