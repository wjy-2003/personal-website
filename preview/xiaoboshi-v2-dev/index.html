function buildAnswer(msg,variant=0){const alternatives={interaction:['建议采用“先批注、再朗读、后说明”的小组任务：每人选择一句标注重音与停连，再由小组推荐一人展示。','可以改成“替换字辩论”：一组主张保留“舞、驰”，另一组尝试替换，双方用画面和情感证据回应。'],cold:['如果学生说不出“惜”的复杂态度，先让他们分别列出帝王的功绩和局限，再选择“肯定、批评、惋惜”中的两个词。','可以先给出“略输、稍逊、只识”三个程度词，让学生比较语气轻重，从词语本身发现评价态度。'],time:['建议第一课时完成字词、上阕朗读和意象赏析；第二课时集中处理评史、主旨与古今思辨。','可以将背景介绍压缩为一张时间轴，把更多时间留给两次朗读展示和“惜”字讨论。'],easy:['建议为朗读设计提供“重音、停连、语调”三项选择表，基础学生先完成一项再解释。','可以把开放赏析拆成“写了什么—怎么写—表达什么”三步支架，降低完整表达难度。'],general:['建议将这一模块改成“文本证据—学生判断—朗读验证—教师追问”的结构，让赏析落到具体词句。','可以减少背景讲解，增加一次可操作的朗读或替换比较，并补充学生可能出现的两种回答。']};let key=msg.includes('互动')?'interaction':msg.includes('冷场')?'cold':msg.includes('课时')?'time':msg.includes('难度')?'easy':'general';return alternatives[key][variant%alternatives[key].length]}
function renderCurrentDrawerView(){if(!state.drawerOpen)return;if(state.drawerView==='setup')renderSetup();else if(state.drawerView==='generating')renderGenerating();else renderWorkspace()}
function fillChatInput(text){const input=$('chatInput');if(!input)return;input.value=text;input.focus();input.setSelectionRange(input.value.length,input.value.length)}
function sendChat(msg,target=state.activeTarget){state.chat.push({role:'user',text:msg});const variant=state.answerSeed++;setTimeout(()=>{const answer=buildAnswer(msg,variant);if(state.drawerView==='workspace')applyAssistantEdit(answer,target);state.chat.push({role:'ai',text:state.drawerView==='workspace'?'已根据你的输入更新右侧教案内容。':answer});renderCurrentDrawerView()},260);renderCurrentDrawerView()}
function bindLineDrag(){document.querySelectorAll('[data-line-drag]').forEach(h=>{h.ondragstart=e=>{state.lineDrag={sectionId:h.dataset.lineDrag,index:+h.dataset.lineIndex};h.closest('.editable-row')?.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(state.lineDrag))}};h.ondragend=()=>{h.closest('.editable-row')?.classList.remove('dragging');document.querySelectorAll('.editable-row.drop-target').forEach(x=>x.classList.remove('drop-target'))}});document.querySelectorAll('.editable-row').forEach(row=>{row.ondragover=e=>{if(!state.lineDrag)return;e.preventDefault();row.classList.add('drop-target')};row.ondragleave=()=>row.classList.remove('drop-target');row.ondrop=e=>{e.preventDefault();row.classList.remove('drop-target');const from=state.lineDrag;const to={sectionId:row.dataset.sectionId,index:+row.dataset.lineRow};state.lineDrag=null;if(!from||from.sectionId!==to.sectionId||from.index===to.index)return;const sec=state.sections.find(x=>x.id===to.sectionId);if(!sec)return;const lines=getSectionLines(sec);const [line]=lines.splice(from.index,1);lines.splice(to.index,0,line);state.dirty.add(`${sec.id}-order`);renderWorkspace();toast('段落位置已调整')}})}
function cleanEditableText(el){const clone=el.cloneNode(true);clone.querySelectorAll('.citation-popover').forEach(x=>x.remove());return clone.textContent.trim()}
function markAiLine(sec,index){sec.aiLines=sec.aiLines||[];if(!sec.aiLines.includes(index))sec.aiLines.push(index)}
function applyAssistantEdit(text,target){let sectionId=target?.sectionId;if(!sectionId){const last=state.chat[state.chat.length-1]?.text||'';sectionId=last.includes('板书')?'blackboard':last.includes('章节')?'activity':'activity'}const sec=state.sections.find(x=>x.id===sectionId)||state.sections.find(x=>x.id==='activity')||state.sections[0];if(!sec)return;const lines=getSectionBodyLines(sec);if(Number.isInteger(target?.lineIndex)&&lines[target.lineIndex]){lines[target.lineIndex]=text;markAiLine(sec,target.lineIndex);state.dirty.add(`${sec.id}-${target.lineIndex}`)}else if((state.chat[state.chat.length-1]?.text||'').includes('添加章节')){const id=`module-${Date.now()}`;state.sections.splice(state.sections.findIndex(x=>x.id===sec.id)+1,0,{id,title:'补充章节',time:'—',lines:[text],aiLines:[0]});state.dirty.add(`${id}-0`);sectionId=id}else{lines.push(text);markAiLine(sec,lines.length-1);state.dirty.add(`${sec.id}-${lines.length-1}`)}requestAnimationFrame(()=>document.querySelector(`[data-section="${sectionId}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}));toast('已更新右侧教案')}

function taskPlanVariants(name,time='8 分钟'){const lines=taskTemplates[name]||[];const variants={问题链设计:['递进追问方案','证据定位方案','开放思辨方案'],知识点解读:['关键词讲解方案','例句支架方案','易错辨析方案'],小组讨论:['协作讨论方案','分层汇报方案','观点交锋方案'],角色扮演:['角色任务方案','评审辩论方案','情境访谈方案'],实验探究:['比较实验方案','替换验证方案','朗读对照方案'],课堂小测:['即时检测方案','分层检测方案','出口卡方案']};return (variants[name]||[`${name}方案一`,`${name}方案二`,`${name}方案三`]).map((n,i)=>({name:n,time,source:name,confidence:['88%','86%','84%'][i],ai:true,lines:i===0?lines:lines.map((line,j)=>j===0?`${n}：${line.replace(/^.*?：/,'')}`:line)}))}
function sectionPlanOptions(s){if(!s)return[];const title=s.title||'';if(s.id==='activity'||title.includes('课堂活动'))return Object.keys(taskTemplates).map(name=>({name,time:'8 分钟',ai:true,lines:taskTemplates[name]}));if(s.plans)return s.plans;if(title.includes('导入'))return planOptions.intro;if(title.includes('小结'))return planOptions.summary;if(title.includes('作业'))return planOptions.homework;const taskName=Object.keys(taskTemplates).find(name=>title.includes(name));if(taskName)return taskPlanVariants(taskName,s.time||'8 分钟');return[]}
function showMorePlans(id){const sec=state.sections.find(x=>x.id===id);const plans=sectionPlanOptions(sec);if(!sec||!plans.length){toast('暂无更多方案');return}if(state.openPlanMenu===id)return;state.openPlanMenu=id;renderWorkspace()}
function hideMorePlans(id){if(state.openPlanMenu!==id)return;state.openPlanMenu=null;renderWorkspace()}
function addPlanToSection(id,idx){const sec=state.sections.find(x=>x.id===id);const plan=sectionPlanOptions(sec)[idx];if(!sec||!plan)return;const lines=getSectionBodyLines(sec);const start=lines.length;lines.push(`${plan.name}：`);plan.lines.forEach(line=>lines.push(line));if(plan.ai){for(let i=start;i<lines.length;i++)markAiLine(sec,i)}state.dirty.add(`${id}-plan-${idx}`);state.openPlanMenu=null;renderWorkspace();requestAnimationFrame(()=>{const el=document.querySelector(`[data-section="${id}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})});toast(`已添加方案 ${idx+1}`)}
function insertModule(name){return insertModuleAfter(null,name)}
function insertModuleAfter(afterId,name){const lines=moduleTemplates[name];if(!lines)return;const id=`module-${Date.now()}`;const insertAt=afterId?state.sections.findIndex(x=>x.id===afterId)+1:state.sections.length;const section={id,title:name,time:'—',lines:structuredClone(lines)};if(insertAt>0)state.sections.splice(insertAt,0,section);else state.sections.push(section);renderWorkspace();requestAnimationFrame(()=>{const el=document.querySelector(`[data-section="${id}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})});toast(`已添加${name}`)}
function insertTaskLine(id,task){const sourceIndex=state.sections.findIndex(x=>x.id===id);const source=state.sections[sourceIndex];if(!source)return;const newId=`task-${Date.now()}`;const lines=taskTemplates[task]||[`${task}：请在此补充${task}的具体设计。`];state.sections.splice(sourceIndex+1,0,{id:newId,title:task,time:'8 分钟',lines:structuredClone(lines)});renderWorkspace();requestAnimationFrame(()=>{const el=document.querySelector(`[data-section="${newId}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})});toast(`已添加${task}任务模块`)}
function openContext(e,id,j){e.preventDefault();document.querySelectorAll('.context-menu').forEach(x=>x.remove());const sec=state.sections.find(x=>x.id===id);const lineText=Number.isInteger(j)?getSectionLines(sec)[j]:'';const tasks=['问题链设计','知识点解读','小组讨论','角色扮演','实验探究','课堂小测'];const m=document.createElement('div');m.className='context-menu';m.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;`;m.innerHTML=`<div class="menu-item"><button class="btn btn-ghost btn-sm menu-btn" style="justify-content:flex-start" id="addTaskX">添加任务</button><div class="menu-submenu">${tasks.map(t=>`<button class="btn btn-ghost btn-sm menu-btn" data-task="${t}">${t}</button>`).join('')}</div></div><button class="btn btn-ghost btn-sm menu-btn" style="justify-content:flex-start" id="copyX">${Number.isInteger(j)?'复制段落':'复制模块'}</button>`;document.body.appendChild(m);$('copyX').onclick=()=>{m.remove();copyToClipboard(Number.isInteger(j)?lineText:getSectionLines(sec).join('\n'))};m.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{m.remove();insertTaskLine(id,b.dataset.task)});setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}
function openModuleContext(e,id){openContext(e,id)}
function showAddTask(id){const sec=state.sections.find(x=>x.id===id);const opts=['问题链设计','知识点解读','小组讨论','角色扮演','实验探究','课堂小测'];modal('添加任务',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>选择要插入的教学活动类型</span></div></div><div class="feedback-options" style="flex-direction:column;gap:8px">${opts.map(o=>`<button class="feedback-option add-task-opt" data-task="${o}" style="text-align:left;padding:10px 12px">${o}</button>`).join('')}</div>`,`<button class="btn btn-secondary" data-close>取消</button>`);document.querySelectorAll('.add-task-opt').forEach(b=>b.onclick=()=>{const task=b.dataset.task;insertTaskLine(id,task);closeModal()})}
function showModuleAsk(id){const sec=state.sections.find(x=>x.id===id);modal('基于当前模块提问',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>${esc(getSectionLines(sec).join(' '))}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这个模块如何增加互动？学生可能有什么反应？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:null};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showAsk(id,j){const sec=state.sections.find(x=>x.id===id);const lines=getSectionLines(sec);modal('基于选中段落提问',`<div class="recognized"><div><strong>已选中段落</strong><span>${esc(lines[j])}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这段学生可能有什么反应？如何增加互动？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:j};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showCompare(id,action,j=0){const sec=state.sections.find(x=>x.id===id);if(!sec)return;const lines=getSectionBodyLines(sec);const index=Number.isInteger(j)?j:0;const old=lines[index]||lines[0]||'';const fresh=action==='增加互动'?old+' 学生先独立写下判断，再由小组轮流发言；教师抽取一组不同意见进行追问。':action==='更简洁'?old.replace(/。.*$/,'。'):action==='更具体'?old+' 教师可补充“莽莽”形容白茫茫一片、“妖娆”突出红装素裹的具体画面。':action==='加例子'?old+' 例如：用“略输文采”与“稍逊风骚”比较两个词语气轻重的差异。':action==='降低难度'?old+' 建议提供“重音、停连、语调”三项选择表，基础学生先完成其中一项并解释。':action==='调整时长'?old+' 若课时紧张，可将此处压缩为同桌互读并抽查一组展示。':action==='口语化'?old+' 可以换成更像老师上课会说的话，比如“先看看这句写了什么，再想它为什么这么写”。':old+' 教师根据学生可能出现的两类回答准备追问，并设置可操作的支架。';lines[index]=fresh;state.dirty.add(`${sec.id}-${index}`);const sectionEl=document.querySelector(`[data-section="${id}"]`);if(sectionEl){const lineEl=sectionEl.querySelector(`[data-section-id="${id}"][data-line-index="${index}"]`);if(lineEl)lineEl.innerText=fresh}toast(`已更新“${sec.title}”中的内容`)}
function showAudit(){modal('导出前检查',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>格式要求文件是否准备好</b><p>当前教案已按格式要求文件的结构校验，可继续导出。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源置信度已达标</b><p>参考资料、格式要求文件和原课件均已用于本次备课。</p></div></div></div>`,`<button class="btn btn-secondary" data-close>继续修改</button><button class="btn btn-primary" id="auditExport">继续导出</button>`);$('auditExport').onclick=()=>{closeModal();showExport()}}
function showExport(){modal('导出教案',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>格式要求文件是否准备好</b><p>当前教案已按格式要求文件的结构校验，可继续导出。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源置信度已达标</b><p>参考资料、格式要求文件和原课件均已用于本次备课。</p></div></div></div><p style="margin:14px 0 0;color:var(--ink-3);font-size:12px">确认无误后直接导出当前内容。</p>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="downloadWord">导出 Word</button>`);$('downloadWord').onclick=()=>{exportWord();closeModal()}}
function exportWord(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>教案</title></head><body><h1 style="text-align:center">${esc(state.query)}</h1><p>班级基础：${state.inputs.base}　课时：${state.inputs.duration}　风格：${state.inputs.style}</p>${state.sections.map((s,i)=>`<h2>${i+1}. ${esc(s.title)}（${s.time}）</h2>${getSectionLines(s).map(l=>`<p>${esc(l)}</p>`).join('')}`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='教案_'+state.query.replace(/[\\/:*?"<>|\s]+/g,'_')+'.doc';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Word 教案已导出')}
function showSourceDoc(idx){const doc=sourceDocs[idx];if(!doc)return;modal(doc.name,`<div class="recognized"><div><strong>资料预览</strong><span>${esc(doc.summary)}</span></div></div><div class="audit-list"><div class="audit-item">${icon('file')}<div><b>已用于当前教案引用</b><p>你可以根据这份资料继续核对教案结构、课堂活动和练习设计。</p></div></div></div>`,`<button class="btn btn-secondary" data-close>关闭</button>`)}

function showSolutionPrompt(){modal('例题思路 · “山舞银蛇，原驰蜡象，欲与天公试比高”',`<div class="solution-step"><b>1</b><div><div class="highlight">抓意象：圈出“山、银蛇、原、蜡象、天公”，明确比喻/拟人对象。</div><div class="why">作用：先建立画面，让学生从具象进入抽象。</div></div></div><div class="solution-step"><b>2</b><div><div class="highlight">品动词：“舞”“驰”化静为动，写出群山高原的勃勃生机。</div><div class="why">作用：引导学生体会以动写静的手法效果。</div></div></div><div class="solution-step"><b>3</b><div><div class="highlight">析情感：“欲与天公试比高”把景物人格化，暗含诗人的豪迈气概。</div><div class="why">作用：从景物赏析自然过渡到下阕评史抒怀。</div></div></div>`,`<button class="btn btn-secondary" data-close>关闭</button>`)}
function modal(title,body,foot){const old=$('globalModal');if(old)old.remove();const el=document.createElement('div');el.id='globalModal';el.className='modal';el.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;document.body.appendChild(el);el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const el=$('globalModal');if(el)el.remove()}
render();
</script></body></html>
