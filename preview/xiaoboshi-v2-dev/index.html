/* context menu */
.context-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:190;width:168px}
.context-menu .menu-btn{width:100%;justify-content:flex-start;margin-bottom:2px}
.context-menu .menu-btn:last-child{margin-bottom:0}
.context-menu .menu-item{position:relative}
.context-menu .menu-submenu{display:none;position:absolute;left:100%;top:-5px;min-width:132px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px}
.context-menu .menu-item:hover .menu-submenu{display:block}
.context-menu .menu-submenu .menu-btn{margin:0 0 2px}
.context-menu .menu-submenu .menu-btn:last-child{margin:0}

/* simulate classroom */
.sim-btn{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid #e8ecf1;background:#fff;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.sim-btn:hover{border-color:var(--brand-line);color:var(--brand);background:var(--brand-soft)}
.sim-bubble{margin-top:10px;padding:12px;border-radius:10px;background:#fafcff;border:1px solid var(--brand-line)}
.sim-bubble-title{font-size:12px;color:var(--ink-2);margin-bottom:9px}
.sim-options{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.sim-option{border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:#fff;font-size:12px;color:var(--ink-2);cursor:pointer}
.sim-option:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.sim-generated{padding:8px 10px;background:#fff;border-radius:6px;border-left:3px solid var(--brand);margin-bottom:8px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.sim-generated b{color:var(--brand);font-weight:650}
.sim-end{font-size:11px;color:var(--ink-3);text-decoration:underline;cursor:pointer}
.sim-end:hover{color:var(--brand)}

/* solution prompt */
.solution-step{margin-bottom:12px}
.solution-step b{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;text-align:center;line-height:20px;font-size:11px;margin-right:8px}
.solution-step .highlight{background:#fffbe6;padding:8px 10px;border-radius:6px;display:inline-block;width:calc(100% - 30px);vertical-align:top;color:var(--ink)}
.solution-step .why{font-size:11px;color:var(--ink-3);margin:4px 0 0 30px}

/* workspace feedback */
.ws-feedback-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding-right:4px}
.ws-feedback-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ws-feedback-item .sec-name{flex:1;font-size:12.5px;font-weight:650}
.ws-feedback-item .sec-time{font-size:11px;color:var(--ink-3);margin-left:auto}
.ws-feedback-btns{display:flex;gap:6px}

function buildAnswer(msg,variant=0){const alternatives={interaction:['建议采用“先批注、再朗读、后说明”的小组任务：每人选择一句标注重音与停连，再由小组推荐一人展示。','可以改成“替换字辩论”：一组主张保留“舞、驰”，另一组尝试替换，双方用画面和情感证据回应。'],cold:['如果学生说不出“惜”的复杂态度，先让他们分别列出帝王的功绩和局限，再选择“肯定、批评、惋惜”中的两个词。','可以先给出“略输、稍逊、只识”三个程度词，让学生比较语气轻重，从词语本身发现评价态度。'],time:['建议第一课时完成字词、上阕朗读和意象赏析；第二课时集中处理评史、主旨与古今思辨。','可以将背景介绍压缩为一张时间轴，把更多时间留给两次朗读展示和“惜”字讨论。'],easy:['建议为朗读设计提供“重音、停连、语调”三项选择表，基础学生先完成一项再解释。','可以把开放赏析拆成“写了什么—怎么写—表达什么”三步支架，降低完整表达难度。'],general:['建议将这一模块改成“文本证据—学生判断—朗读验证—教师追问”的结构，让赏析落到具体词句。','可以减少背景讲解，增加一次可操作的朗读或替换比较，并补充学生可能出现的两种回答。']};let key=msg.includes('互动')?'interaction':msg.includes('冷场')?'cold':msg.includes('课时')?'time':msg.includes('难度')?'easy':'general';return alternatives[key][variant%alternatives[key].length]}

function openContext(e,id,j){e.preventDefault();document.querySelectorAll('.context-menu').forEach(x=>x.remove());const sec=state.sections.find(x=>x.id===id);const lineText=Number.isInteger(j)?getSectionLines(sec)[j]:'';const m=document.createElement('div');m.className='context-menu';m.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;`;m.innerHTML=`<button class="btn btn-ghost btn-sm menu-btn" style="justify-content:flex-start" id="askX">${icon('chat')} 问问小博士</button><div class="menu-item"><button class="btn btn-ghost btn-sm menu-btn" style="justify-content:flex-start" id="addTaskX">添加任务</button><div class="menu-submenu">${['小组讨论','角色扮演','实验探究','提问链','课堂小测'].map(t=>`<button class="btn btn-ghost btn-sm menu-btn" data-task="${t}">${t}</button>`).join('')}</div></div><button class="btn btn-ghost btn-sm menu-btn" style="justify-content:flex-start" id="copyX">${icon('copy')} ${Number.isInteger(j)?'复制段落':'复制模块'}</button>`;document.body.appendChild(m);$('askX').onclick=()=>{m.remove();Number.isInteger(j)?showAsk(id,j):showModuleAsk(id)};$('copyX').onclick=()=>{m.remove();copyToClipboard(Number.isInteger(j)?lineText:getSectionLines(sec).join('\n'))};m.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{m.remove();insertTaskLine(id,b.dataset.task)});setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}
function openModuleContext(e,id){openContext(e,id)}
function showAddTask(id){const sec=state.sections.find(x=>x.id===id);const opts=['小组讨论','角色扮演','实验探究','提问链','课堂小测'];modal('添加任务',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>选择要插入的教学活动类型</span></div></div><div class="feedback-options" style="flex-direction:column;gap:8px">${opts.map(o=>`<button class="feedback-option add-task-opt" data-task="${o}" style="text-align:left;padding:10px 12px">${o}</button>`).join('')}</div>`,`<button class="btn btn-secondary" data-close>取消</button>`);document.querySelectorAll('.add-task-opt').forEach(b=>b.onclick=()=>{const task=b.dataset.task;insertTaskLine(id,task);closeModal()})}
function showModuleAsk(id){const sec=state.sections.find(x=>x.id===id);modal('问问小博士',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>${esc(getSectionLines(sec).join(' '))}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这个模块如何增加互动？学生可能有什么反应？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:null};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showAsk(id,j){const sec=state.sections.find(x=>x.id===id);modal('问问小博士',`<div class="recognized"><div><strong>已选中段落</strong><span>${esc(sec.lines[j])}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这段学生可能有什么反应？如何增加互动？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:j};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showCompare(id,action,j=0){const sec=state.sections.find(x=>x.id===id);if(!sec)return;const lines=getSectionBodyLines(sec);const index=Number.isInteger(j)?j:0;const old=lines[index]||lines[0]||'';const fresh=action==='增加互动'?old+' 学生先独立写下判断，再由小组轮流发言；教师抽取一组不同意见进行追问。':action==='更简洁'?old.replace(/。.*$/,'。'):action==='更具体'?old+' 教师可补充“莽莽”形容白茫茫一片、“妖娆”突出红装素裹的具体画面。':action==='加例子'?old+' 例如：用“略输文采”与“稍逊风骚”比较两个词语气轻重的差异。':action==='降低难度'?old+' 建议提供“重音、停连、语调”三项选择表，基础学生先完成其中一项并解释。':action==='调整时长'?old+' 若课时紧张，可将此处压缩为同桌互读并抽查一组展示。':action==='口语化'?old+' 可以换成更像老师上课会说的话，比如“先看看这句写了什么，再想它为什么这么写”。':old+' 教师根据学生可能出现的两类回答准备追问，并设置可操作的支架。';lines[index]=fresh;state.dirty.add(`${sec.id}-${index}`);const sectionEl=document.querySelector(`[data-section="${id}"]`);if(sectionEl){const lineEl=sectionEl.querySelector(`[data-line="${id}-${index}"]`);if(lineEl)lineEl.innerText=fresh}toast(`已更新“${sec.title}”中的内容`)}
function showAudit(){modal('导出前检查',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>导入视频需控制时长</b><p>两段雪景视频建议合计不超过3分钟。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源已识别</b><p>参考资料、格式要求文件和原课件均已用于本次备课。</p></div></div></div>`,`<button class="btn btn-secondary" data-close>继续修改</button><button class="btn btn-primary" id="auditExport">继续导出</button>`);$('auditExport').onclick=()=>{closeModal();showExport()}}
function showExport(){modal('导出教案',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>导入视频需控制时长</b><p>两段雪景视频建议合计不超过3分钟。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源已识别</b><p>参考资料、格式要求文件和原课件均已用于本次备课。</p></div></div></div><p style="margin:14px 0 0;color:var(--ink-3);font-size:12px">确认无误后直接导出当前方案。</p>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="downloadWord">导出 Word</button>`);$('downloadWord').onclick=()=>{exportWord();closeModal();setTimeout(showFeedback,350)}}
function exportWord(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>教案</title></head><body><h1 style="text-align:center">${esc(state.query)}</h1><p>班级基础：${state.inputs.base}　课时：${state.inputs.duration}　风格：${state.inputs.style}</p>${state.sections.map((s,i)=>`<h2>${i+1}. ${esc(s.title)}（${s.time}）</h2>${getSectionLines(s).map(l=>`<p>${esc(l)}</p>`).join('')}`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='教案_'+state.query.replace(/[\\/:*?"<>|\s]+/g,'_')+'.doc';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Word 教案已导出')}

function showWorkspaceFeedback(){state.wsFeedbackOpen=true;renderWorkspace()}
function showFeedback(){modal('这节课上完后，欢迎回来告诉我',`<p style="margin-top:0;color:var(--ink-3);font-size:12px">您的反馈会为小博士沉淀该班级的备课经验，下次生成更贴合！</p><div class="feedback-options"><button class="feedback-option" data-feedback="好用">👍<br><b>整体好用</b></button><button class="feedback-option" data-feedback="需调整">🛠<br><b>需要调整</b></button></div><textarea class="feedback-note" placeholder="例如：导入有效，但练习偏难（可稍后填写）"></textarea>`,`<button class="btn btn-secondary" data-close>稍后再说</button><button class="btn btn-primary" id="saveFeedback">保存并复制本课</button>`);document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{state.feedback=b.dataset.feedback;document.querySelectorAll('[data-feedback]').forEach(x=>x.classList.toggle('selected',x===b))});$('saveFeedback').onclick=()=>{closeModal();toast('反馈已保存，下次可从本课复制创建')}}
function showSolutionPrompt(){modal('例题思路 · “山舞银蛇，原驰蜡象，欲与天公试比高”',`<div class="solution-step"><b>1</b><div><div class="highlight">抓意象：圈出“山、银蛇、原、蜡象、天公”，明确比喻/拟人对象。</div><div class="why">作用：先建立画面，让学生从具象进入抽象。</div></div></div><div class="solution-step"><b>2</b><div><div class="highlight">品动词：“舞”“驰”化静为动，写出群山高原的勃勃生机。</div><div class="why">作用：引导学生体会以动写静的手法效果。</div></div></div><div class="solution-step"><b>3</b><div><div class="highlight">析情感：“欲与天公试比高”把景物人格化，暗含诗人的豪迈气概。</div><div class="why">作用：从景物赏析自然过渡到下阕评史抒怀。</div></div></div>`,`<button class="btn btn-secondary" data-close>关闭</button>`)}
function modal(title,body,foot){const old=$('globalModal');if(old)old.remove();const el=document.createElement('div');el.id='globalModal';el.className='modal';el.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;document.body.appendChild(el);el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const el=$('globalModal');if(el)el.remove()}
render();
</script></body></html>
