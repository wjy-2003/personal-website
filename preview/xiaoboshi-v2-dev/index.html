<body><div id="app"></div><script>
const $=id=>document.getElementById(id);
const icons={book:'▤',spark:'✦',file:'▧',ppt:'▣',link:'⌁',chat:'◌',quiz:'✓',task:'≡',check:'✓',upload:'↑',clock:'◷',risk:'!',sync:'↻',more:'⋯',home:'⌂',back:'‹',collapse:'‹',expand:'›',drag:'⠿',edit:'✎'};
const baseSections=[
 {id:'goal',title:'教学目标',time:'—',lines:['有节奏、有气势地朗读并背诵全词，掌握“莽莽、妖娆、风骚、天骄、风流人物”等词语。','圈画“望、舞、驰、惜、数”等关键词，赏析虚实相生、化静为动、对比等手法。','梳理“景—史—情”的结构，理解词人热爱山河、评点历史、抒发抱负的情感脉络。','联系新时代青年使命，思考“风流人物”的当代内涵。']},
 {id:'focus',title:'教学重点与难点',time:'—',lines:['教学重点：通过朗读设计和意象赏析，体会上阕雄浑壮阔的雪景意境。','教学重点：抓住“惜”和“数风流人物，还看今朝”，理解下阕评史明志的作用。','教学难点：理解“惜”中既有肯定又有惋惜的辩证态度，并将古代英雄与新时代担当建立联系。']},
 {id:'intro',title:'导入',time:'5 分钟',lines:['先呈现《江雪》中清冷孤寂的雪景，再播放北国长城、黄土高原的壮阔雪景。','提问：“同样是写雪，两组画面给你的感受有何不同？”学生用一个词写下第一感受。','从“清冷孤寂”与“壮阔豪迈”的差异切入《沁园春·雪》，板书课题与作者。']},
 {id:'preview',title:'任务一：自主预学',time:'10 分钟',lines:['学生借助教材注释完成字音、词义和文体常识检测，重点辨析“分外、数风流人物、风骚”。','结合课件标注节奏、领字和韵脚，明确“望”“惜”在句首领起下文。','用四至六个字概括上下阕内容：上阕绘雪景，下阕评英雄、抒抱负。']},
 {id:'scene',title:'任务二：品“多娇江山”',time:'20 分钟',lines:['圈画上阕意象：冰封、雪飘、长城、大河、群山、高原、晴日，概括画面特点。','聚焦“望”字，梳理从“长城内外”到“欲与天公试比高”的统领范围和空间层次。','比较“山舞银蛇，原驰蜡象”中的“舞、驰”与普通动词，体会化静为动的力量感。','辨析眼前雪景与“须晴日”的想象，理解虚实相生、红白映衬的审美效果。']},
 {id:'read1',title:'朗读设计：上阕',time:'10 分钟',lines:['“北国风光”豪迈而舒缓；“千里冰封，万里雪飘”拉长重读，读出空间的辽阔。','“望”后稍作停顿，“山舞银蛇，原驰蜡象”提高语调、加快节奏，读出动态气势。','“须晴日，看红装素裹，分外妖娆”放慢语速，读出对祖国山河的赞叹。']},

function applyPlan(id){state.selectedPlan=id;const sec=state.sections.find(x=>x.id==='intro');sec.lines=id==='scene'?['呈现《江雪》清冷孤寂的雪景，再播放北国长城、黄土高原的壮阔雪景。','提问：“同样是写雪，两组画面给你的感受有何不同？”学生先写下一个感受词，再说明画面依据。','从“清冷孤寂”与“壮阔豪迈”的差异进入《沁园春·雪》。']:id==='conflict'?['教师分别用平缓和豪迈两种语气朗读“千里冰封，万里雪飘”。','学生投票选择更符合文本的一种，并从意象、节奏和情感三个角度说明理由。','由朗读差异提出本课任务：这首词的“气魄之大”从何而来？']:['展示毛泽东《沁园春·雪》手迹和1945年重庆传播故事。','提问：“为什么这首写于九年前的旧作会在重庆引起轰动？”','学生带着“意境、气势、文笔”三个关键词进入文本阅读。'];renderWorkspace()}
function renderChatMessage(m,i){return `<div class="bubble ${m.role}">${esc(m.text)}${m.role==='ai'&&m.actionable?`<div class="answer-actions"><button class="answer-action ${m.accepted?'accepted':''}" data-accept-answer="${i}" ${m.accepted?'disabled':''}>${m.accepted?'已采纳':'采纳'}</button><button class="answer-action" data-refresh-answer="${i}">换一个</button></div>`:''}</div>`}
function buildAnswer(msg,variant=0){const alternatives={interaction:['建议采用“先批注、再朗读、后说明”的小组任务：每人选择一句标注重音与停连，再由小组推荐一人展示。','可以改成“替换字辩论”：一组主张保留“舞、驰”，另一组尝试替换，双方用画面和情感证据回应。'],cold:['如果学生说不出“惜”的复杂态度，先让他们分别列出帝王的功绩和局限，再选择“肯定、批评、惋惜”中的两个词。','可以先给出“略输、稍逊、只识”三个程度词，让学生比较语气轻重，从词语本身发现评价态度。'],time:['建议第一课时完成字词、上阕朗读和意象赏析；第二课时集中处理评史、主旨与古今思辨。','可以将背景介绍压缩为一张时间轴，把更多时间留给两次朗读展示和“惜”字讨论。'],easy:['建议为朗读设计提供“重音、停连、语调”三项选择表，基础学生先完成一项再解释。','可以把开放赏析拆成“写了什么—怎么写—表达什么”三步支架，降低完整表达难度。'],general:['建议将这一模块改成“文本证据—学生判断—朗读验证—教师追问”的结构，让赏析落到具体词句。','可以减少背景讲解，增加一次可操作的朗读或替换比较，并补充学生可能出现的两种回答。']};let key=msg.includes('互动')?'interaction':msg.includes('冷场')?'cold':msg.includes('课时')?'time':msg.includes('难度')?'easy':'general';return alternatives[key][variant%alternatives[key].length]}
function sendChat(msg,target=state.activeTarget){state.chat.push({role:'user',text:msg});const variant=state.answerSeed++;setTimeout(()=>{state.chat.push({role:'ai',text:buildAnswer(msg,variant),actionable:true,target:target?{...target}:null,prompt:msg,variant});renderWorkspace()},260);renderWorkspace()}
function acceptAnswer(index){const answer=state.chat[index];if(!answer||answer.role!=='ai')return;let target=answer.target;if(!target){const fallback=state.sections.find(x=>x.id==='intro')||state.sections[0];target={sectionId:fallback.id,lineIndex:0}}const sec=state.sections.find(x=>x.id===target.sectionId);if(!sec)return;if(Number.isInteger(target.lineIndex)){sec.lines[target.lineIndex]=answer.text;state.dirty.add(`${sec.id}-${target.lineIndex}`)}else{sec.lines=[...sec.lines,answer.text];state.dirty.add(`${sec.id}-${sec.lines.length-1}`)}answer.accepted=true;renderWorkspace();toast(`已采纳到“${sec.title}”`)}
function refreshAnswer(index){const answer=state.chat[index];if(!answer)return;answer.variant=(answer.variant||0)+1;answer.text=buildAnswer(answer.prompt||'',answer.variant);answer.accepted=false;renderWorkspace()}
function openContext(e,id,j){e.preventDefault();document.querySelectorAll('.context-menu').forEach(x=>x.remove());const sec=state.sections.find(x=>x.id===id);const m=document.createElement('div');m.className='context-menu';m.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:190;width:150px`;m.innerHTML=`<button class="btn btn-ghost btn-sm" style="width:100%;justify-content:flex-start" id="askX">${icon('chat')} 问问小博士</button><button class="btn btn-ghost btn-sm" style="width:100%;justify-content:flex-start" id="rewriteX">${icon('edit')} AI 改写对照</button>`;document.body.appendChild(m);$('askX').onclick=()=>{m.remove();showAsk(id,j)};$('rewriteX').onclick=()=>{m.remove();showCompare(id,'更贴近真实课堂',j)};setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}
function openModuleContext(e,id){if(e.target.closest('.editable-line'))return;e.preventDefault();document.querySelectorAll('.context-menu').forEach(x=>x.remove());const sec=state.sections.find(x=>x.id===id);const m=document.createElement('div');m.className='context-menu';m.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:190;width:150px`;m.innerHTML=`<button class="btn btn-ghost btn-sm" style="width:100%;justify-content:flex-start" id="askModule">${icon('chat')} 问问小博士</button>`;document.body.appendChild(m);$('askModule').onclick=()=>{m.remove();showModuleAsk(id)};setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}
function showAddTask(id){const sec=state.sections.find(x=>x.id===id);const opts=['小组讨论','角色扮演','实验探究','提问链','课堂小测'];modal('添加任务',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>选择要插入的教学活动类型</span></div></div><div class="feedback-options" style="flex-direction:column;gap:8px">${opts.map(o=>`<button class="feedback-option add-task-opt" data-task="${o}" style="text-align:left;padding:10px 12px">${o}</button>`).join('')}</div>`,`<button class="btn btn-secondary" data-close>取消</button>`);document.querySelectorAll('.add-task-opt').forEach(b=>b.onclick=()=>{const task=b.dataset.task;sec.lines.push(`${task}：请在此补充${task}的具体设计。`);state.dirty.add(`${sec.id}-${sec.lines.length-1}`);closeModal();renderWorkspace();toast(`已插入${task}到“${sec.title}”`)})}
function showModuleAsk(id){const sec=state.sections.find(x=>x.id===id);modal('问问小博士',`<div class="recognized"><div><strong>当前模块：${esc(sec.title)}</strong><span>${esc(sec.lines.join(' '))}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这个模块如何增加互动？学生可能有什么反应？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:null};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showAsk(id,j){const sec=state.sections.find(x=>x.id===id);modal('问问小博士',`<div class="recognized"><div><strong>已选中段落</strong><span>${esc(sec.lines[j])}</span></div></div><textarea id="askText" class="feedback-note" placeholder="例如：这段学生可能有什么反应？如何增加互动？"></textarea>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="askSubmit">发送</button>`);$('askSubmit').onclick=()=>{const v=$('askText').value.trim();closeModal();if(v){state.activeTarget={sectionId:id,lineIndex:j};sendChat(`针对“${sec.title}”：${v}`,state.activeTarget)}}}
function showCompare(id,action,j=0){const sec=state.sections.find(x=>x.id===id),old=sec.lines[j]||sec.lines[0],fresh=action==='增加互动'?old+' 学生先独立写下判断，再由小组轮流发言；教师抽取一组不同意见进行追问。':action==='更简洁'?old.replace(/。.*$/,'。'):action==='更具体'?old+' 教师可补充“莽莽”形容白茫茫一片、“妖娆”突出红装素裹的具体画面。':action==='加例子'?old+' 例如：用“略输文采”与“稍逊风骚”比较两个词语气轻重的差异。':action==='降低难度'?old+' 建议提供“重音、停连、语调”三项选择表，基础学生先完成其中一项并解释。':action==='调整时长'?old+' 若课时紧张，可将此处压缩为同桌互读并抽查一组展示。':old+' 教师根据学生可能出现的两类回答准备追问，并设置可操作的支架。';modal(`AI 优化 · ${action}`,`<div class="compare"><div class="compare-box"><b>原内容</b>${esc(old)}</div><div class="compare-box new"><b>小博士建议</b>${esc(fresh)}</div></div><p style="font-size:11px;color:var(--ink-3);margin-top:12px">确认后只替换当前段落，其他环节不会变化。</p>`,`<button class="btn btn-secondary" data-close>保留原文</button><button class="btn btn-primary" id="acceptChange">采用建议</button>`);$('acceptChange').onclick=()=>{sec.lines[j]=fresh;state.dirty.add(`${sec.id}-${j}`);closeModal();renderWorkspace();toast('已替换当前段落，可撤销或继续修改')}}
function showAudit(){modal('导出前检查',`<div class="audit-score"><div class="score">91</div><div><b>教案结构完整，可继续导出</b></div></div><div class="audit-list"><div class="audit-item">${icon('check')}<div><b>两课时任务分配清晰</b><p>第一课时聚焦上阕与朗读，第二课时聚焦评史、明志与整合。</p></div></div><div class="audit-item">${icon('check')}<div><b>教学目标与活动对应</b><p>朗读、意象赏析、评史思辨和拓展表达均有课堂任务承接。</p></div></div><div class="audit-item warn">${icon('risk')}<div><b>导入视频需控制时长</b><p>两段雪景视频建议合计不超过3分钟。</p></div></div><div class="audit-item">${icon('check')}<div><b>资料来源已识别</b><p>参考资料、真实教案和原课件均已用于本次备课。</p></div></div></div>`,`<button class="btn btn-secondary" data-close>继续修改</button><button class="btn btn-primary" id="auditExport">继续导出</button>`);$('auditExport').onclick=()=>{closeModal();showExport()}}
function showExport(){modal('导出教案',`<p style="margin-top:0;color:var(--ink-2)">选择导出格式。Demo 当前可直接导出 Word。</p><label style="display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--line)"><input type="checkbox" checked><span>${icon('file')} <b>教案</b></span><span style="margin-left:auto;color:var(--ink-3);font-size:11px">.doc</span></label>`,`<button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="downloadWord">导出 Word</button>`);$('downloadWord').onclick=()=>{exportWord();closeModal();setTimeout(showFeedback,350)}}
function exportWord(){const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>教案</title></head><body><h1 style="text-align:center">${esc(state.query)}</h1><p>班级基础：${state.inputs.base}　课时：${state.inputs.duration}　风格：${state.inputs.style}</p>${state.sections.map((s,i)=>`<h2>${i+1}. ${esc(s.title)}（${s.time}）</h2>${s.lines.map(l=>`<p>${esc(l)}</p>`).join('')}`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='教案_'+state.query.replace(/[\\/:*?"<>|\s]+/g,'_')+'.doc';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Word 教案已导出')}
function showFeedback(){modal('这节课上完后，欢迎回来告诉我',`<p style="margin-top:0;color:var(--ink-3);font-size:12px">30 秒反馈会沉淀为这个班的备课经验，下次生成更贴合。</p><div class="feedback-options"><button class="feedback-option" data-feedback="好用">👍<br><b>整体好用</b></button><button class="feedback-option" data-feedback="需调整">🛠<br><b>需要调整</b></button></div><textarea class="feedback-note" placeholder="例如：导入有效，但练习偏难（可稍后填写）"></textarea>`,`<button class="btn btn-secondary" data-close>稍后再说</button><button class="btn btn-primary" id="saveFeedback">保存并复制本课</button>`);document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{state.feedback=b.dataset.feedback;document.querySelectorAll('[data-feedback]').forEach(x=>x.classList.toggle('selected',x===b))});$('saveFeedback').onclick=()=>{closeModal();toast('反馈已保存，下次可从本课复制创建')}}
function modal(title,body,foot){const old=$('globalModal');if(old)old.remove();const el=document.createElement('div');el.id='globalModal';el.className='modal';el.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;document.body.appendChild(el);el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){const el=$('globalModal');if(el)el.remove()}
render();
</script></body></html>
